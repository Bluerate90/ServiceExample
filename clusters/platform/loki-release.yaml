apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: monitoring
spec:
  interval: 10m
  timeout: 10m
  chart:
    spec:
      chart: loki-stack
      version: "2.10.2"
      sourceRef:
        kind: HelmRepository
        name: grafana-charts
        namespace: flux-system
  values:
    loki:
      enabled: true
    promtail:
      enabled: true
    grafana:
      enabled: false
      sidecar:
        datasources:
          defaultDatasourceEnabled: false
