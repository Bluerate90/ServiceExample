apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: serviceexample
  namespace: default
spec:
  interval: 5m
  chart:
    spec:
      chart: serviceexample
      version: ">=0.1.0"
      sourceRef:
        kind: HelmRepository
        name: serviceexample
        namespace: flux-system
  values:
    app:
      image:
        repository: bluerate90/serviceexample
        tag: latest
